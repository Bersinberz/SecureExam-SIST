# ─────────────────────────────────────────────────────────────────────────────
# Nginx — SecureExam Production Config
# Tuned for 300+ concurrent users on a high-spec server
# ─────────────────────────────────────────────────────────────────────────────

worker_processes      auto;
worker_rlimit_nofile  65535;

events {
    worker_connections  8192;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;
    error_log  /var/log/nginx/error.log  warn;

    # ── Performance ───────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75;
    keepalive_requests  10000;
    server_tokens       off;
    reset_timedout_connection on;

    # Client timeouts
    client_header_timeout  15s;
    client_body_timeout    30s;
    send_timeout           30s;

    # Buffer sizes
    client_body_buffer_size    128k;
    client_max_body_size       10m;
    client_header_buffer_size  1k;
    large_client_header_buffers 4 8k;

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_buffers      16 8k;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── SSL ───────────────────────────────────────────────────────────────
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # ── Rate limiting zones ───────────────────────────────────────────────
    # login: 10 attempts per minute per IP
    limit_req_zone  $binary_remote_addr zone=login:10m  rate=10r/m;
    # api: 120 requests per minute per IP (2/s) — generous for exam traffic
    limit_req_zone  $binary_remote_addr zone=api:20m    rate=120r/m;
    # execute: 6 code runs per minute per IP
    limit_req_zone  $binary_remote_addr zone=execute:10m rate=6r/m;

    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # ── Proxy cache for static API responses ─────────────────────────────
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m
                     max_size=100m inactive=5m use_temp_path=off;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────
    server {
        listen      80;
        listen      [::]:80;
        server_name securexam.info www.securexam.info;

        # Allow Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ─────────────────────────────────────────────────
    server {
        listen      443 ssl http2;
        listen      [::]:443 ssl http2;
        server_name securexam.info www.securexam.info;

        ssl_certificate     /etc/letsencrypt/live/securexam.info/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/securexam.info/privkey.pem;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Security headers ──────────────────────────────────────────────
        add_header X-Frame-Options                "DENY"                                    always;
        add_header X-Content-Type-Options         "nosniff"                                 always;
        add_header X-XSS-Protection               "1; mode=block"                           always;
        add_header Referrer-Policy                "strict-origin-when-cross-origin"         always;
        add_header Strict-Transport-Security      "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy             "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
            always;

        # ── Login endpoint — tightest rate limit ──────────────────────────
        location = /api/auth/login {
            limit_req  zone=login burst=5 nodelay;
            limit_conn perip 10;

            proxy_pass         http://server:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── Code execution — separate rate limit ──────────────────────────
        location = /api/execute/run {
            limit_req  zone=execute burst=3 nodelay;
            limit_conn perip 3;

            proxy_pass         http://server:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── General API proxy ─────────────────────────────────────────────
        location /api/ {
            limit_req  zone=api burst=40 nodelay;
            limit_conn perip 20;

            proxy_pass         http://server:5000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            client_max_body_size  10m;

            # Don't cache API responses by default
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # ── Static assets — aggressive caching ───────────────────────────
        location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files  $uri =404;
            access_log off;
        }

        # ── SPA fallback ──────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ── Block common attack paths ─────────────────────────────────────
        location ~* \.(php|asp|aspx|jsp|cgi|sh|bash)$ {
            return 444;
        }
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
